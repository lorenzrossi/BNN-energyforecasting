[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "energyforecast"
version = "0.2.0"
description = "Rolling-origin forecasts of Italian hourly electricity generation with point and Bayesian neural networks"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "torch>=2.0",
]

[project.optional-dependencies]
data = ["gdown>=4.7"]
notebooks = [
    "jupyter",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "diptest",
]
tensorflow = ["tensorflow>=2.12"]
blitz = ["blitz-bayesian-pytorch>=0.2.8"]

[project.scripts]
energyforecast = "energyforecast.cli:main"

[tool.setuptools]
packages = ["energyforecast"]

[tool.ruff]
line-length = 100
